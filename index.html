<!doctype html>
<html lang="en" data-theme="claude-code">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141312" />
    <title>SCOPE · Daniil Tkachev</title>
    <meta
      name="description"
      content="Daniil Tkachev’s personal workspace and trophy shelf."
    />
    <link rel="icon" href="./assets/scope.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles/fonts.css" />
    <link rel="stylesheet" href="./src/themes/claude-code/tokens.css" />
    <link rel="stylesheet" href="./src/themes/vibe-v1/tokens.css" />
    <link rel="stylesheet" href="./src/themes/vibe-v2/tokens.css" />
    <link rel="stylesheet" href="./src/styles/components.css" />
    <link rel="stylesheet" href="./src/styles/pet.css" />
    <link rel="stylesheet" href="./src/themes/claude-code/components.css" />
    <link rel="stylesheet" href="./src/themes/vibe-v1/components.css" />
    <link rel="stylesheet" href="./src/themes/vibe-v2/components.css" />
  </head>
  <body>
    <header class="mast">
      <div class="identity">
        <a class="wordmark" href="#workspace" aria-label="SCOPE workspace"
          ><img
            src="./assets/scope.svg"
            width="32"
            height="32"
            alt=""
          />SCOPE</a
        ><span class="divider"></span
        ><a
          class="profile-link"
          href="https://github.com/cByteRun"
          target="_blank"
          rel="noopener"
          >Daniil Tkachev ↗</a
        >
      </div>
      <div class="tools">
        <span class="clock"><i></i><time id="clock"></time> ALMT</span
        ><button id="appearance" aria-haspopup="dialog">
          <span data-icon="moon"></span>Theme
        </button>
      </div>
    </header>
    <main>
      <section
        id="workspace"
        role="tabpanel"
        aria-labelledby="tab-workspace"
      ></section>
      <section
        id="shelf"
        role="tabpanel"
        aria-labelledby="tab-shelf"
        hidden
      ></section>
    </main>
    <footer>
      <span class="hint"
        ><span data-icon="hand"></span>Drag stickers · double-click to
        rotate</span
      >
      <nav class="dock" role="tablist" aria-label="Views">
        <button
          role="tab"
          id="tab-workspace"
          aria-controls="workspace"
          aria-selected="true"
        >
          <span data-icon="terminal"></span>Workspace
        </button>
        <button
          role="tab"
          id="tab-shelf"
          aria-controls="shelf"
          aria-selected="false"
          tabindex="-1"
        >
          <span data-icon="shelf"></span>Trophy Shelf
        </button>
      </nav>
    </footer>
    <dialog id="settings" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button data-close aria-label="Close">×</button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
