<!doctype html>
<html lang="en" data-theme="claude-code">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141312" />
    <title>Daniil Tkachev · Proof of Work Hub | Builder Deck</title>
    <meta
      name="description"
      content="Daniil Tkachev’s public engineering portfolio. Explore B2B SaaS, AI and Web3 projects, source code and hackathon credentials."
    />
    <link rel="icon" href="./assets/daniil-avatar.webp" type="image/webp" />
    <link rel="preload" as="font" type="font/ttf" href="./assets/fonts/classicpixel.ttf" crossorigin />
    <link rel="preload" as="font" type="font/woff" href="./assets/fonts/jetbrains-mono.woff" crossorigin />
    <link rel="stylesheet" href="./src/styles/fonts.css" />
    <link rel="stylesheet" href="./src/themes/claude-code/tokens.css" />
    <link rel="stylesheet" href="./src/themes/vibe-v1/tokens.css" />
    <link rel="stylesheet" href="./src/themes/vibe-v2/tokens.css" />
    <link rel="stylesheet" href="./src/styles/components.css" />
    <link rel="stylesheet" href="./src/styles/pet.css" />
    <link rel="stylesheet" href="./src/styles/proof-links.css" />
    <link rel="stylesheet" href="./src/styles/achievements.css" />
    <link rel="stylesheet" href="./src/themes/claude-code/components.css" />
    <link rel="stylesheet" href="./src/themes/vibe-v1/components.css" />
    <link rel="stylesheet" href="./src/themes/vibe-v2/components.css" />
    <link rel="stylesheet" href="./src/styles/hub.css" />
  </head>
  <body>
    <header class="mast">
      <div class="identity">
        <a
          class="wordmark"
          href="/"
          aria-label="Builder Deck · Proof of Work Hub"
          ><img
            src="./assets/daniil-avatar.webp"
            width="32"
            height="32"
            alt=""
          />Builder Deck</a
        ><span class="divider"></span
        ><a
          class="profile-link"
          href="https://github.com/cByteRun"
          target="_blank"
          rel="noopener"
          >Daniil Tkachev ↗</a
        >
      </div>
      <div class="tools">
        <nav id="header-socials" aria-label="Social profiles"></nav>
        <select id="site-language" aria-label="Language"><option value="en">EN</option><option value="ru">RU</option><option value="kk">KZ</option></select>
        <button id="open-palette" aria-label="Open command palette" aria-haspopup="dialog"><span data-icon="terminal"></span><kbd>Ctrl K</kbd></button>
        <span class="clock" title="Almaty time (UTC+5)"
          ><time id="clock"></time
          ><span class="zone"
            ><span class="offset">UTC+5 / </span>ALMT</span
          ></span
        ><button id="appearance" aria-haspopup="dialog">
          <span data-icon="moon"></span>Theme
        </button>
      </div>
    </header>
    <main>
      <section id="hub" role="tabpanel" aria-labelledby="tab-hub"><!--public-portfolio--></section>
      <section
        id="workspace" hidden
        role="tabpanel"
        aria-labelledby="tab-workspace"
      ></section>
      <section
        id="shelf"
        role="tabpanel"
        aria-labelledby="tab-shelf"
        hidden
      ></section>
    </main>
    <footer>
      <div class="view-switcher">
        <nav class="dock" role="tablist" aria-label="Views">
          <button role="tab" id="tab-hub" aria-controls="hub" aria-selected="true" tabindex="0"><span data-icon="layers"></span><span data-label="Portfolio">Portfolio</span></button>
          <button role="tab" id="tab-shelf" aria-controls="shelf" aria-selected="false" tabindex="-1"><span data-icon="shelf"></span><span data-label="Trophy Shelf">Trophy Shelf</span></button>
          <button role="tab" id="tab-workspace" aria-controls="workspace" aria-selected="false" tabindex="-1"><span data-icon="terminal"></span><span data-label="Workspace">Workspace</span></button>
        </nav>
        <div class="rover-lane">
          <button
            id="rover"
            class="rover"
            aria-label="Pet the roaming cyber-cat"
          ></button>
        </div>
      </div>
      <section class="wins-bar" aria-labelledby="wins-label">
        <span id="wins-label" class="wins-label">RECENT WINS //</span>
        <div id="wins-window" class="wins-window">
          <div id="wins-track" class="wins-track"></div>
        </div>
      </section>
    </footer>
    <div id="portfolio-overlays"></div>
    <dialog id="settings" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button data-close aria-label="Close">×</button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
